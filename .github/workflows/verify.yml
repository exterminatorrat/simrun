name: Verify SimRun
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests with mocked providers
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/simrun-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser.py --url http://127.0.0.1:5173
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: simrun-sites-handoff
          path: simrun-sites-handoff.zip
          retention-days: 7
