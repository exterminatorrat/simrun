name: Verify SimRun
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore source transfer when present
        run: |
          if [ -f .handoff/source.zip.b64 ]; then
            python3 - <<'PY'
          import base64, io, zipfile, pathlib
          p=pathlib.Path('.handoff/source.zip.b64')
          z=zipfile.ZipFile(io.BytesIO(base64.b64decode(p.read_text())))
          for name in z.namelist():
              q=pathlib.PurePosixPath(name)
              if q.is_absolute() or '..' in q.parts or name.startswith('.git/'):
                  raise ValueError('Unsafe archive entry')
          z.extractall('.')
          p.unlink()
          PY
          fi
      - name: Install, build and test
        if: hashFiles('package.json') != ''
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; fi
          npm ci
          npm run build
          npm test
      - name: Browser verification
        if: hashFiles('package.json') != ''
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Synchronize verified source
        if: hashFiles('package.json') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'synchronize verified application and dependency lock'
            git push origin HEAD:main
          fi
      - name: Package verified source
        if: hashFiles('package.json') != ''
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('package.json') != ''
        with:
          name: simrun-verified
          path: |
            simrun-sites-handoff.zip
            verification/
            playwright-report/
          retention-days: 7
